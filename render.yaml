# Free-tier API deployment on Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fasal-sahaayak-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUSTED_PROXIES
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
